<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即兴演讲练习录制器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 600;
        }

        .subtitle {
            color: #8892b0;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        video {
            width: 100%;
            display: block;
            transform: scaleX(-1); /* Mirror effect */
        }

        .timer-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        .timer-overlay.recording {
            background: rgba(220, 38, 38, 0.8);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .recording-indicator {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 16px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .recording-indicator.active {
            opacity: 1;
        }

        .recording-dot {
            width: 12px;
            height: 12px;
            background: #ef4444;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-start {
            background: #10b981;
            color: white;
        }

        .btn-start:hover:not(:disabled) {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-stop {
            background: #ef4444;
            color: white;
        }

        .btn-stop:hover:not(:disabled) {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .btn-download {
            background: #3b82f6;
            color: white;
        }

        .btn-download:hover:not(:disabled) {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .btn-camera {
            background: #8b5cf6;
            color: white;
        }

        .btn-camera:hover:not(:disabled) {
            background: #7c3aed;
            transform: translateY(-2px);
        }

        .tips {
            margin-top: 40px;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tips h3 {
            color: #10b981;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .tips ul {
            list-style: none;
            color: #a0aec0;
            line-height: 1.8;
        }

        .tips li::before {
            content: "→ ";
            color: #10b981;
        }

        .framework {
            margin-top: 20px;
            padding: 20px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 8px;
            border-left: 4px solid #3b82f6;
        }

        .framework h4 {
            color: #3b82f6;
            margin-bottom: 10px;
        }

        .framework p {
            color: #cbd5e1;
            line-height: 1.6;
        }

        .status {
            margin-top: 20px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            color: #8892b0;
        }

        .recordings-list {
            margin-top: 30px;
            width: 100%;
            max-width: 800px;
        }

        .recordings-list h3 {
            margin-bottom: 15px;
            color: #8892b0;
        }

        .recording-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .recording-item span {
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <h1>即兴演讲练习录制器</h1>
    <p class="subtitle">3分钟演练 · What / So What / Now What</p>

    <div class="video-container">
        <video id="preview" autoplay muted playsinline></video>
        <div class="recording-indicator" id="recordingIndicator">
            <div class="recording-dot"></div>
            <span>录制中</span>
        </div>
        <div class="timer-overlay" id="timer">00:00</div>
    </div>

    <div class="controls">
        <button class="btn-camera" id="cameraBtn" onclick="startCamera()">
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                <path d="M4 5a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2V7a2 2 0 00-2-2h-1.586a1 1 0 01-.707-.293l-1.121-1.121A2 2 0 0011.172 3H8.828a2 2 0 00-1.414.586L6.293 4.707A1 1 0 015.586 5H4zm6 9a3 3 0 100-6 3 3 0 000 6z"/>
            </svg>
            开启摄像头
        </button>
        <button class="btn-start" id="startBtn" onclick="startRecording()" disabled>
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>
            </svg>
            开始录制
        </button>
        <button class="btn-stop" id="stopBtn" onclick="stopRecording()" disabled>
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clip-rule="evenodd"/>
            </svg>
            停止录制
        </button>
        <button class="btn-download" id="downloadBtn" onclick="downloadRecording()" disabled>
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
            下载视频
        </button>
    </div>

    <p class="status" id="status">点击「开启摄像头」开始准备</p>

    <div class="tips">
        <h3>演讲框架提示</h3>
        <div class="framework">
            <h4>What / So What / Now What</h4>
            <p>
                <strong>What（是什么）</strong>：陈述事实、更新或反馈<br>
                <strong>So What（为什么重要）</strong>：解释这对听众的意义<br>
                <strong>Now What（下一步）</strong>：明确接下来的行动
            </p>
        </div>
        <ul style="margin-top: 20px;">
            <li>目标时长：3分钟</li>
            <li>看向镜头，保持眼神交流</li>
            <li>犯错不要停，保持角色状态</li>
            <li>结尾用总结句收尾：「我的核心观点是...」</li>
        </ul>
    </div>

    <div class="recordings-list" id="recordingsList" style="display: none;">
        <h3>已录制的视频</h3>
        <div id="recordingsContainer"></div>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let stream;
        let timerInterval;
        let seconds = 0;
        let recordings = [];

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'user'
                    },
                    audio: true
                });

                const preview = document.getElementById('preview');
                preview.srcObject = stream;

                document.getElementById('cameraBtn').disabled = true;
                document.getElementById('startBtn').disabled = false;
                document.getElementById('status').textContent = '摄像头已就绪，点击「开始录制」开始你的3分钟演练';

            } catch (err) {
                console.error('无法访问摄像头:', err);
                document.getElementById('status').textContent = '无法访问摄像头，请检查权限设置';
            }
        }

        function startRecording() {
            recordedChunks = [];
            seconds = 0;

            const options = { mimeType: 'video/webm;codecs=vp9,opus' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options.mimeType = 'video/webm;codecs=vp8,opus';
            }
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options.mimeType = 'video/webm';
            }

            mediaRecorder = new MediaRecorder(stream, options);

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const timestamp = new Date().toLocaleString('zh-CN');
                const duration = formatTime(seconds);

                recordings.push({ url, timestamp, duration, blob });
                updateRecordingsList();

                document.getElementById('downloadBtn').disabled = false;
                document.getElementById('status').textContent = `录制完成！时长：${duration}，点击「下载视频」保存`;
            };

            mediaRecorder.start(1000);

            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('downloadBtn').disabled = true;
            document.getElementById('recordingIndicator').classList.add('active');
            document.getElementById('timer').classList.add('recording');
            document.getElementById('status').textContent = '正在录制... 记住：What → So What → Now What';

            timerInterval = setInterval(updateTimer, 1000);
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }

            clearInterval(timerInterval);

            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('recordingIndicator').classList.remove('active');
            document.getElementById('timer').classList.remove('recording');
        }

        function updateTimer() {
            seconds++;
            document.getElementById('timer').textContent = formatTime(seconds);

            // 3分钟提醒
            if (seconds === 180) {
                document.getElementById('timer').style.background = 'rgba(245, 158, 11, 0.8)';
                document.getElementById('status').textContent = '已到3分钟！可以准备收尾了';
            }
            // 超时提醒
            if (seconds === 210) {
                document.getElementById('timer').style.background = 'rgba(239, 68, 68, 0.9)';
            }
        }

        function formatTime(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const secs = (totalSeconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function downloadRecording() {
            if (recordings.length === 0) return;

            const latest = recordings[recordings.length - 1];
            const a = document.createElement('a');
            a.href = latest.url;
            const date = new Date().toISOString().slice(0, 10);
            a.download = `即兴演讲练习_${date}_${latest.duration.replace(':', 'm')}s.webm`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function updateRecordingsList() {
            const container = document.getElementById('recordingsContainer');
            const list = document.getElementById('recordingsList');

            if (recordings.length > 0) {
                list.style.display = 'block';
                container.innerHTML = recordings.map((rec, idx) => `
                    <div class="recording-item">
                        <span>录制 #${idx + 1} - ${rec.timestamp} (${rec.duration})</span>
                        <button class="btn-download" onclick="downloadSpecific(${idx})" style="padding: 8px 16px; font-size: 14px;">
                            下载
                        </button>
                    </div>
                `).join('');
            }
        }

        function downloadSpecific(index) {
            const rec = recordings[index];
            const a = document.createElement('a');
            a.href = rec.url;
            a.download = `即兴演讲练习_${index + 1}_${rec.duration.replace(':', 'm')}s.webm`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // 页面关闭前提醒
        window.onbeforeunload = function() {
            if (recordings.length > 0) {
                return '你有未下载的录制视频，确定要离开吗？';
            }
        };
    </script>
</body>
</html>
